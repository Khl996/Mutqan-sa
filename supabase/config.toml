# Supabase project configuration for Mutqan CMMS.
# Generated to enable `supabase db reset` / `supabase start` to build the
# database from a single baseline migration. The `project_id` is the local
# project name used by the CLI (not a secret).

project_id = "mutqan-sa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the production database major version (PostgreSQL 17).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Email testing server (Inbucket) for local development.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Edge Functions deployed for this project (see supabase/functions/).
[functions.resend-email]
verify_jwt = true

[functions.send-otp]
verify_jwt = false

[functions.update-password]
verify_jwt = false

[analytics]
enabled = false
